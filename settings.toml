[default]
db.mongodb_uri = "mongodb://localhost:27017"
pulsar.url = "http://localhost:8913"
pulsar.status.poll_interval = 4
pulsar.status.max_polls = 400
pulsar.client_timeout = 30

logging.level = "DEBUG"
logging.output_json = false

oauth.enable = false
# Accepted token issuers (exactly as in the tokens' "iss") and this
# service's audience; both are required when oauth is enabled.
oauth.issuers = []
oauth.audience = ""
# Seconds (positive) for discovery, JWKS and userinfo calls.
oauth.timeout = 10
# Also ask the issuer's userinfo endpoint about each token (cached per
# token, at most 5 minutes); the issuers must offer one.
oauth.userinfo.enable = false
# Lists given as environment variables (JSON arrays) replace these lists.
basic_auth.enable = false
basic_auth.username = "user"
basic_auth.password = "password"

[dev-docker]
db.mongodb_uri = "mongodb://tesp-db:27017"
pulsar.url = "http://pulsar_rest:8913"
logging.output_json = false
